<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İkinci Ayımız Kutlu Olsun</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Arka plan müzik dosyası (Dosya adını kendi şarkınla değiştirebilirsin) -->
    <audio id="bgMusic" src="sarki.mp3" loop></audio>

    <div class="window">
        <div class="titlebar">
            <span>LOVE</span>
            <div class="buttons">
                <span class="btn-min"></span>
                <span class="btn-max"></span>
                <span class="btn-close"></span>
            </div>
        </div>
        
        <div class="content">
            <h1 id="mainTitle">Yoyyy! I love you ♡</h1>
            <img src="cat.png" alt="Pixel Cat" id="cat" />
            <p>İkinci ayimiz kutlu olsun aşkimmm ♡E♡E♡
              begendin mii :D
            </p>
            
            <div class="button-group">
                <button id="yesBtn">Evet! ❤️</button>
                <button id="noBtn">Hayır 😢</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
